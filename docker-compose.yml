version: '3.8'

services:
  signaling:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: webrtc-signaling
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - CLIENT_URL=http://localhost:3000
      - LOG_LEVEL=info
      - MAX_PARTICIPANTS=10
      # Optional TURN server config:
      # - TURN_URL=turn:turn.example.com:3478
      # - TURN_USERNAME=user
      # - TURN_CREDENTIAL=pass
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/health']
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webrtc-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_SIGNALING_SERVER=http://localhost:3001
      - NODE_ENV=production
    depends_on:
      - signaling
